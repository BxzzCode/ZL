
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>ZombiLand</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: fixed;
    touch-action: none;
    overscroll-behavior: none;
    background: #17120c;
    font-family: Arial, sans-serif;
}

.menu {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-image: url("F.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

.menu::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
        90deg,
        rgba(0,0,0,.7),
        rgba(0,0,0,.15) 75%
    );
    pointer-events: none;
}

/* LOGO */
.logo {
    position: absolute;
    z-index: 5;
    top: 7%;
    left: 58%;
    transform: translateX(-50%);
    width: min(40%, 420px);
    max-height: 30%;
    object-fit: contain;
    pointer-events: none;
}

/* BOTONES */
.botones {
    position: absolute;
    z-index: 10;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: clamp(135px, 23vw, 230px);
    padding-left: 10px;
}

button {
    width: 100%;
    padding: 13px 8px;
    border: 2px solid #d69a43;
    border-radius: 0 9px 9px 0;
    background: linear-gradient(#49301b, #21150d);
    color: white;
    font-size: clamp(13px, 2vw, 18px);
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 5px 12px #0009;
}

button:active {
    background: #805027;
    transform: scale(.97);
}

/* CRÉDITOS */
.creditos {
    position: absolute;
    z-index: 10;
    bottom: 8px;
    right: 15px;
    color: #ffffffaa;
    font-size: 11px;
}

@media (orientation: portrait) {
    .logo {
        width: 48%;
        left: 65%;
    }

    .botones {
        width: 145px;
    }
}
</style>
</head>

<body>

<div class="menu">

    <img
        class="logo"
        src="ZL.png"
        alt="ZombiLand"
        draggable="false"
    >

    <div class="botones">
        <button onclick="jugar()">JUGAR</button>
        <button onclick="arsenal()">ARSENAL</button>
        <button onclick="ajustes()">AJUSTES</button>
        <button onclick="creditos()">CRÉDITOS</button>
    </div>

    <div class="creditos">ZOMBILAND © 2026</div>

</div>

<script>
function jugar() {
    alert("Preparando partida...");
}

function arsenal() {
    alert("Arsenal próximamente");
}

function ajustes() {
    alert("Ajustes próximamente");
}

function creditos() {
    alert("ZombiLand - Proyecto independiente");
}
</script>

</body>
</html>
